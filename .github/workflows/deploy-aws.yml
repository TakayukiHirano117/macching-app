# main push で AWS 本番へデプロイする。
# 必要な GitHub Secrets / Variables:
#   AWS_ROLE_ARN          … GitHub OIDC 用 IAM Role ARN
#   AWS_REGION            … 例: ap-northeast-1
#   ECR_REPOSITORY        … 例: macching-prod-api
#   ECS_CLUSTER           … 例: macching-prod-cluster
#   ECS_SERVICE           … 例: macching-prod-api
#   ECS_CONTAINER_NAME    … 例: api（任意、default: api）

name: Deploy AWS Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    name: Build and deploy API to ECS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onion-hono-sample

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY }}"
          TAG="${{ github.sha }}"
          echo "uri=${REGISTRY}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: onion-hono-sample
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.uri_latest }}

      - name: Download current task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            > /tmp/task-def.json

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME || 'api' }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
