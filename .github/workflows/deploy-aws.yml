# 親リポジトリ main への PR マージ（push）で AWS 本番 API をデプロイする。
# 直プッシュは GitHub ruleset（restrict-direct-push）で禁止。
#
# 必要な GitHub Secrets:
#   AWS_ROLE_ARN          … GitHub OIDC 用 IAM Role ARN（macching-prod-gha-deploy）
# 必要な GitHub Variables:
#   AWS_REGION            … 例: ap-northeast-1
#   ECR_REPOSITORY        … 例: macching-prod-api
#   ECS_CLUSTER           … 例: macching-prod-cluster
#   ECS_SERVICE           … 例: macching-prod-api
#   ECS_CONTAINER_NAME    … 例: api（任意、default: api）
#
# Front（Amplify）は next-front の main 更新で自動ビルドされる（本 workflow では扱わない）。

name: Deploy AWS Production

on:
  push:
    branches:
      - main
    paths:
      - "onion-hono-sample"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aws-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    name: Build and deploy API to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets and variables
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          missing=0
          for name in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required setting: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "AWS_REGION=${AWS_REGION}"
          echo "ECR_REPOSITORY=${ECR_REPOSITORY}"
          echo "ECS_CLUSTER=${ECS_CLUSTER}"
          echo "ECS_SERVICE=${ECS_SERVICE}"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Log deploy target SHA
        run: |
          echo "parent_sha=${GITHUB_SHA}"
          echo "api_submodule_sha=$(git -C onion-hono-sample rev-parse HEAD)"
          git -C onion-hono-sample log -1 --oneline

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY }}"
          TAG="${{ github.sha }}"
          echo "uri=${REGISTRY}/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "uri_latest=${REGISTRY}/${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: onion-hono-sample
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.uri_latest }}

      - name: Download current task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            > /tmp/task-def.json

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-def.json
          container-name: ${{ vars.ECS_CONTAINER_NAME || 'api' }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
